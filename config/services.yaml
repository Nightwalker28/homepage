- Home:
    - Seafile:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@master/webp/seafile.webp
        href: "{{HOMEPAGE_VAR_SEAFILE_URL}}"
        description: "File Sync & Share"
        server: docker
        container: seafile
    - Siyuan:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@master/webp/siyuan.webp
        href: "{{HOMEPAGE_VAR_SIYUAN_URL}}"
        description: "Personal Knowledge Base"
        server: docker
        container: siyuan

- Media:
    - Jellyfin:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/jellyfin.webp
        href: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
        widget:
            type: jellyfin
            url: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
            key: "{{HOMEPAGE_VAR_JELLYFIN_WIDGET_KEY}}"
            enableBlocks: true
            fields: ["movies", "series", "episodes"]
            enableNowPlaying: false
            enableUser: false
            enableMediaControl: false
            showEpisodeNumber: true
            expandOneStreamToTwoRows: false
        description: "Media Server"
        server: docker
        container: jellyfin
    - Immich:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/immich.webp
        href: "{{HOMEPAGE_VAR_IMMICH_URL}}"
        widget:
            type: immich
            url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
            key: "{{HOMEPAGE_VAR_IMMICH_WIDGET_KEY}}"
            version: 2
        description: "Photo & Video Server"
        server: docker
        container: immich-server
    - Jellyseerr:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/jellyseerr.webp
        href: "{{HOMEPAGE_VAR_JELLYSEERR_URL}}"
        widget:
            type: jellyseerr
            url: "{{HOMEPAGE_VAR_JELLYSEERR_URL}}"
            key: "{{HOMEPAGE_VAR_JELLYSEERR_WIDGET_KEY}}"
        description: "Media Requests"
        server: docker
        container: jellyseerr
    - Sonarr:
        icon: si-sonarr-#2596BE
        href: "{{HOMEPAGE_VAR_SONARR_URL}}"
        widget:
            type: sonarr
            url: "{{HOMEPAGE_VAR_SONARR_URL}}"
            key: "{{HOMEPAGE_VAR_SONARR_WIDGET_KEY}}"
        description: "TV Show Automation"
        server: docker
        container: sonarr
    - Radarr:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr.webp
        href: "{{HOMEPAGE_VAR_RADARR_URL}}"
        widget:
            type: radarr
            url: "{{HOMEPAGE_VAR_RADARR_URL}}"
            key: "{{HOMEPAGE_VAR_RADARR_WIDGET_KEY}}"
        description: "Movie Automation"
        server: docker
        container: radarr
    - Bazarr:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/bazarr.webp
        href: "{{HOMEPAGE_VAR_BAZARR_URL}}"
        widget:
            type: bazarr
            url: "{{HOMEPAGE_VAR_BAZARR_URL}}"
            key: "{{HOMEPAGE_VAR_BAZARR_WIDGET_KEY}}"
        description: "Subtitle Management"
        server: docker
        container: bazarr
    - Tdarr:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/tdarr.webp
        href: "{{HOMEPAGE_VAR_TDARR_URL}}"
        widget:
            type: tdarr
            url: "{{HOMEPAGE_VAR_TDARR_URL}}"
            key: "{{HOMEPAGE_VAR_TDARR_WIDGET_KEY}}"
        description: "Media Transcoding"
        server: docker
        container: tdarr
    - qBittorrent:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/qbittorrent-dark.webp
        href: "{{HOMEPAGE_VAR_QBITTORRENT_URL}}"
        widget:
            type: qbittorrent
            url: "{{HOMEPAGE_VAR_QBITTORRENT_URL}}"
            username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
            password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
            enableLeechProgress: true 
        description: "Torrent Client"
        server: docker
        container: qbittorrent
    - Prowlarr:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/prowlarr.webp
        href: "{{HOMEPAGE_VAR_PROWLARR_URL}}"
        widget:
            type: prowlarr
            url: "{{HOMEPAGE_VAR_PROWLARR_URL}}"
            key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
        description: "Indexer Management"
        server: docker
        container: prowlarr

- Infrastructure:
    - Proxmox:
        icon: si-proxmox-#E57000
        href: "{{HOMEPAGE_VAR_PROXMOX_HREF}}"
        widget:
            type: proxmox
            url: "{{HOMEPAGE_VAR_PROXMOX_API_URL}}"
            username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
            password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
            node: "{{HOMEPAGE_VAR_PROXMOX_NODE}}"
            fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        description: "Proxmox Cluster Overview"
    - Network:
        href: "{{HOMEPAGE_VAR_SPEEDTEST_URL}}"
        widget:
            type: speedtest
            url: "{{HOMEPAGE_VAR_SPEEDTEST_URL}}"
            version: 2
            key: "{{HOMEPAGE_VAR_SPEEDTEST_WIDGET_KEY}}"
            bitratePrecision: 3
        description: "Internet Speed Test"
        server: docker
        container: speedtest
    - AdGuard:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/adguard-home.webp
        href: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        widget:
          type: adguard
          url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
        description: "Network-wide Ad-blocker"
        server: docker
        container: adguard
    - Nginx Proxy Manager:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/nginx-proxy-manager.webp
        href: "{{HOMEPAGE_VAR_NPM_URL}}"
        widget:
          type: npm
          url: "{{HOMEPAGE_VAR_NPM_URL}}"
          username: "{{HOMEPAGE_VAR_NPM_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NPM_PASSWORD}}"
        description: "Simple Reverse Proxy Manager"
        server: docker
        container: npm
    - Vaultwarden:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/bitwarden.webp
        href: "{{HOMEPAGE_VAR_VAULTWARDEN_URL}}"
        description: "Self-hosted Password Manager"
        server: docker
        container: vaultwarden
        showStats: true
    - OnlyOffice:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@master/webp/onlyoffice.webp
        description: "Document Server"
        server: docker
        container: onlyoffice
        showStats: true
    - Postgres:
        icon: si-postgresql-#336791
        description: "Database Server"
        server: docker
        container: postgres
        showStats: true
    - Redis:
        icon: si-redis-#DC382D
        description: "In-memory Data Structure Store"
        server: docker
        container: redis
        showStats: true

