# - Home:

- Media:
    - Jellyfin:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/jellyfin.webp
        href: "${JELLYFIN_URL}"
        widget:
            type: jellyfin
            url: "${JELLYFIN_URL}"
            key: "${JELLYFIN_WIDGET_KEY}"
            enableBlocks: true
            fields: ["movies", "series", "episodes"]
            enableNowPlaying: false
            enableUser: false
            enableMediaControl: false
            showEpisodeNumber: true
            expandOneStreamToTwoRows: false
        description: "Media Server"
        server: docker
        container: jellyfin
    - Immich:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/immich.webp
        href: "${IMMICH_URL}"
        widget:
            type: immich
            url: "${IMMICH_URL}"
            key: "${IMMICH_WIDGET_KEY}"
            version: 2
        description: "Photo & Video Server"
        server: docker
        container: immich-server
    - Nextcloud:
        icon: si-nextcloud-#0082C9
        href: "${NEXTCLOUD_URL}"
        widget:
            type: nextcloud
            url: "${NEXTCLOUD_URL}"
            key: "${NEXTCLOUD_WIDGET_KEY}"
            fields: ["activeusers", "numfiles", "numshares"]
        description: "Photo & Video Server"
        server: docker
        container: nextcloud
    - Sonarr:
        icon: si-sonarr-#2596BE
        href: "${SONARR_URL}"
        widget:
            type: sonarr
            url: "${SONARR_URL}"
            key: "${SONARR_WIDGET_KEY}"
        description: "TV Show Automation"
        server: docker
        container: sonarr
    - Radarr:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr.webp
        href: "${RADARR_URL}"
        widget:
            type: radarr
            url: "${RADARR_URL}"
            key: "${RADARR_WIDGET_KEY}"
        description: "Movie Automation"
        server: docker
        container: radarr
    - qBittorrent:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/qbittorrent-dark.webp
        href: "${QBITTORRENT_URL}"
        widget:
            type: qbittorrent
            url: "${QBITTORRENT_URL}"
            username: "${QBITTORRENT_USERNAME}"
            password: "${QBITTORRENT_PASSWORD}"
            enableLeechProgress: true 
        description: "Torrent Client"
        server: docker
        container: qbittorrent
    - Jackett:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/jackett-light.webp
        href: "${JACKETT_URL}"
        widget:
            type: jackett
            url: "${JACKETT_URL}"
            password: "${JACKETT_PASSWORD}"
        description: "Torrent Indexer"
        server: docker
        container: jackett

- Infrastructure:
    - CPU Usage:
        href: "${GLANCES_URL}"
        widget:
            type: glances
            url: "${GLANCES_URL}"
            version: 4
            metric: cpu
            refreshInterval: 5000
            pointsLimit: 30
        description: "System Monitor"
        server: docker
        container: glances
    - RAM Usage:
        href: "${GLANCES_URL}"
        widget:
            type: glances
            url: "${GLANCES_URL}"
            version: 4
            metric: memory
            refreshInterval: 5000
            pointsLimit: 30
        description: "System Monitor"
        server: docker
        container: glances
    - Network:
        href: "${SPEEDTEST_URL}"
        widget:
            type: speedtest
            url: "${SPEEDTEST_URL}"
            version: 2
            key: "${SPEEDTEST_WIDGET_KEY}"
            bitratePrecision: 3
        description: "Internet Speed Test"
        server: docker
        container: speedtest
    - Disk Usage:
        href: "${GLANCES_URL}"
        widget:
            type: glances
            url: "${GLANCES_URL}"
            version: 4
            metric: disk:sda
            refreshInterval: 5000
            pointsLimit: 30
        description: "System Monitor"
        server: docker
        container: glances
    - Portainer:
        icon: si-portainer-#13BEF9
        href: "${PORTAINER_URL}"
        widget:
          type: portainer
          url: "${PORTAINER_URL}"
          env: 3
          key: "${PORTAINER_WIDGET_KEY}"
          fields: ["running", "stopped", "total"]
        description: "Docker Management made Simple"
        server: docker
        container: portainer 
    - Watchtower:
        icon: si-watchtower-#3CA4FF
        widget:
            type: watchtower
            url: "${WATCHTOWER_URL}"
            key: "${WATCHTOWER_WIDGET_KEY}"
        description: "Automated Docker Container Updates"
        server: docker
        container: watchtower
    - AdGuard:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/adguard-home.webp
        href: "${ADGUARD_URL}"
        widget:
          type: adguard
          url: "${ADGUARD_URL}"
          username: "${ADGUARD_USERNAME}"
          password: "${ADGUARD_PASSWORD}"
        description: "Network-wide Ad-blocker"
        server: docker
        container: adguard
    - Nginx Proxy Manager:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/nginx-proxy-manager.webp
        href: "${NPM_URL}"
        widget:
          type: npm
          url: "${NPM_URL}"
          username: "${NPM_USERNAME}"
          password: "${NPM_PASSWORD}"
        description: "Simple Reverse Proxy Manager"
        server: docker
        container: npm
    - Postgres:
        icon: si-postgresql-#336791
        description: "Database Server"
        server: docker
        container: postgres
    - Redis:
        icon: si-redis-#DC382D
        description: "In-memory Data Structure Store"
        server: docker
        container: redis

