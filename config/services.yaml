- System & Monitoring:
    - CPU Usage:
        href: http://nas:61208
        widget:
            type: glances
            url: http://nas:61208
            version: 4
            metric: cpu
            refreshInterval: 5000
            pointsLimit: 30
    - RAM Usage:
        href: http://nas:61208
        widget:
            type: glances
            url: http://nas:61208
            version: 4
            metric: memory
            refreshInterval: 5000
            pointsLimit: 30
    - Disk Usage:
        href: http://nas:61208
        widget:
            type: glances
            url: http://nas:61208
            version: 4
            metric: disk:sda
            refreshInterval: 5000
            pointsLimit: 30

- Media Servers:
    - Jellyfin:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/jellyfin.webp
