- Home:
    - Calendar:
        widget:
            type: calendar
            view: monthly
            maxEvents: 10
            showTime: true
            timezone: "{{HOMEPAGE_VAR_TIMEZONE}}"
            integrations:
              - type: ical
                url: "{{HOMEPAGE_VAR_ICAL_URL}}"
                name: "Events"
                color:
                params:
                    showName: false

- Media:
    - Jellyfin:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/jellyfin.webp
        href: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
        widget:
            type: jellyfin
            url: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
            key: "{{HOMEPAGE_VAR_JELLYFIN_WIDGET_KEY}}"
            enableBlocks: true
            fields: ["movies", "series", "episodes"]
            enableNowPlaying: false
            enableUser: false
            enableMediaControl: false
            showEpisodeNumber: true
            expandOneStreamToTwoRows: false
        description: "Media Server"
        server: docker
        container: jellyfin
    - Immich:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/immich.webp
        href: "{{HOMEPAGE_VAR_IMMICH_URL}}"
        widget:
            type: immich
            url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
            key: "{{HOMEPAGE_VAR_IMMICH_WIDGET_KEY}}"
            version: 2
        description: "Photo & Video Server"
        server: docker
        container: immich-server
    - Nextcloud:
        icon: si-nextcloud-#0082C9
        href: "{{HOMEPAGE_VAR_NEXTCLOUD_URL}}"
        widget:
            type: nextcloud
            url: "{{HOMEPAGE_VAR_NEXTCLOUD_URL}}"
            key: "{{HOMEPAGE_VAR_NEXTCLOUD_WIDGET_KEY}}"
            fields: ["activeusers", "numfiles", "numshares"]
        description: "Photo & Video Server"
        server: docker
        container: nextcloud
    - Sonarr:
        icon: si-sonarr-#2596BE
        href: "{{HOMEPAGE_VAR_SONARR_URL}}"
        widget:
            type: sonarr
            url: "{{HOMEPAGE_VAR_SONARR_URL}}"
            key: "{{HOMEPAGE_VAR_SONARR_WIDGET_KEY}}"
        description: "TV Show Automation"
        server: docker
        container: sonarr
    - Radarr:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr.webp
        href: "{{HOMEPAGE_VAR_RADARR_URL}}"
        widget:
            type: radarr
            url: "{{HOMEPAGE_VAR_RADARR_URL}}"
            key: "{{HOMEPAGE_VAR_RADARR_WIDGET_KEY}}"
        description: "Movie Automation"
        server: docker
        container: radarr
    - qBittorrent:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/qbittorrent-dark.webp
        href: "{{HOMEPAGE_VAR_QBITTORRENT_URL}}"
        widget:
            type: qbittorrent
            url: "{{HOMEPAGE_VAR_QBITTORRENT_URL}}"
            username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
            password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
            enableLeechProgress: true 
        description: "Torrent Client"
        server: docker
        container: qbittorrent
    - Jackett:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/jackett-light.webp
        href: "{{HOMEPAGE_VAR_JACKETT_URL}}"
        widget:
            type: jackett
            url: "{{HOMEPAGE_VAR_JACKETT_URL}}"
            password: "{{HOMEPAGE_VAR_JACKETT_PASSWORD}}"
        description: "Torrent Indexer"
        server: docker
        container: jackett

- Infrastructure:
    - CPU Usage:
        href: "{{HOMEPAGE_VAR_GLANCES_URL}}"
        widget:
            type: glances
            url: "{{HOMEPAGE_VAR_GLANCES_URL}}"
            version: 4
            metric: cpu
            refreshInterval: 5000
            pointsLimit: 30
        description: "System Monitor"
        server: docker
        container: glances
    - RAM Usage:
        href: "{{HOMEPAGE_VAR_GLANCES_URL}}"
        widget:
            type: glances
            url: "{{HOMEPAGE_VAR_GLANCES_URL}}"
            version: 4
            metric: memory
            refreshInterval: 5000
            pointsLimit: 30
        description: "System Monitor"
        server: docker
        container: glances
    - Network:
        href: "{{HOMEPAGE_VAR_SPEEDTEST_URL}}"
        widget:
            type: speedtest
            url: "{{HOMEPAGE_VAR_SPEEDTEST_URL}}"
            version: 2
            key: "{{HOMEPAGE_VAR_SPEEDTEST_WIDGET_KEY}}"
            bitratePrecision: 3
        description: "Internet Speed Test"
        server: docker
        container: speedtest
    - Disk Usage:
        href: "{{HOMEPAGE_VAR_GLANCES_URL}}"
        widget:
            type: glances
            url: "{{HOMEPAGE_VAR_GLANCES_URL}}"
            version: 4
            metric: disk:sda
            refreshInterval: 5000
            pointsLimit: 30
        description: "System Monitor"
        server: docker
        container: glances
    - Portainer:
        icon: si-portainer-#13BEF9
        href: "{{HOMEPAGE_VAR_PORTAINER_URL}}"
        widget:
          type: portainer
          url: "{{HOMEPAGE_VAR_PORTAINER_URL}}"
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_WIDGET_KEY}}"
          fields: ["running", "stopped", "total"]
        description: "Docker Management made Simple"
        server: docker
        container: portainer 
    - Watchtower:
        icon: si-watchtower-#3CA4FF
        widget:
            type: watchtower
            url: "{{HOMEPAGE_VAR_WATCHTOWER_URL}}"
            key: "{{HOMEPAGE_VAR_WATCHTOWER_WIDGET_KEY}}"
        description: "Automated Docker Container Updates"
        server: docker
        container: watchtower
    - AdGuard:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/adguard-home.webp
        href: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        widget:
          type: adguard
          url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
        description: "Network-wide Ad-blocker"
        server: docker
        container: adguard
    - Nginx Proxy Manager:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/nginx-proxy-manager.webp
        href: "{{HOMEPAGE_VAR_NPM_URL}}"
        widget:
          type: npm
          url: "{{HOMEPAGE_VAR_NPM_URL}}"
          username: "{{HOMEPAGE_VAR_NPM_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NPM_PASSWORD}}"
        description: "Simple Reverse Proxy Manager"
        server: docker
        container: npm
    - Postgres:
        icon: si-postgresql-#336791
        description: "Database Server"
        server: docker
        container: postgres
    - Redis:
        icon: si-redis-#DC382D
        description: "In-memory Data Structure Store"
        server: docker
        container: redis

