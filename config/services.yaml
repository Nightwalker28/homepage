- Calendar:
    - Media Calendar:
        id: widget-calendar
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr-v1.webp
        href: "{{HOMEPAGE_VAR_CALENDAR_URL}}"
        description: Sonarr and Radarr release calendar
        siteMonitor: http://widget-gateway:3001/internal/v1/widgets/calendar/health
        widget:
          type: customapi
          url: http://widget-gateway:3001/internal/v1/widgets/calendar/summary
          refreshInterval: 30000
          mappings:
            - field: data.today
              label: Today
              format: number
            - field: data.movies
              label: Movies
              format: number
            - field: data.episodes
              label: Episodes
              format: number
            - field: data.upcoming
              label: Upcoming
              format: number

- MEDIA:
