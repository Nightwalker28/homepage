- Infrastructure:
    - Proxmox:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/proxmox.webp
        href: "{{HOMEPAGE_VAR_PROXMOX_HREF}}"
        widget:
            type: proxmox
            url: "{{HOMEPAGE_VAR_PROXMOX_API_URL}}"
            username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
            password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
            fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        description: "Proxmox Cluster Overview"
    - Network:
        href: "{{HOMEPAGE_VAR_SPEEDTEST_URL}}"
        widget:
            type: speedtest
            url: "{{HOMEPAGE_VAR_SPEEDTEST_URL}}"
            version: 2
            key: "{{HOMEPAGE_VAR_SPEEDTEST_WIDGET_KEY}}"
            bitratePrecision: 3
        description: "Internet Speed Test"
        server: docker
        container: speedtest
    - AdGuard:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/adguard-home.webp
        href: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        widget:
          type: adguard
          url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
        description: "Network-wide Ad-blocker"
        server: docker
        container: adguard
    - Authentik:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/authentik.webp
        href: "{{HOMEPAGE_VAR_AUTHENTIK_URL}}"
        widget:
          type: authentik
          url: "{{HOMEPAGE_VAR_AUTHENTIK_URL}}"
          key: "{{HOMEPAGE_VAR_AUTHENTIK_key}}"
          version: 2
        description: "Identity Provider"
        server: docker
        container: authentik-server
    - Home Assistant:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/home-assistant.webp
        href: "{{HOMEPAGE_VAR_HOME_ASSISTANT_URL}}"
        widget:
          type: homeassistant
          url: "{{HOMEPAGE_VAR_HOME_ASSISTANT_URL}}"
          key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_WIDGET_KEY}}"
        description: "Home Automation"
        server: docker
        container: homeassistant
    - Dockhand:
        icon: si-docker-#2496ED
        href: "{{HOMEPAGE_VAR_DOCKHAND_URL}}"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_DOCKHAND_STATS_URL}}"
          refreshInterval: 15000
          display: block
          mappings:
            - field: 0.containers.total
              label: Containers
              format: number
            - field: 0.containers.running
              label: Running
              format: number
            - field: 0.containers.stopped
              label: Stopped
              format: number
            - field: 0.containers.unhealthy
              label: Unhealthy
              format: number
        description: "Container manager stats"
        server: docker
        container: dockhand
    - Dockhand Updates:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/dockhand.webp
        href: "{{HOMEPAGE_VAR_DOCKHAND_URL}}"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_DOCKHAND_API_URL}}"
          refreshInterval: 15000
          display: block
          mappings:
            # schedules[0] is latest env update run
            - field: schedules.0.lastExecution.details.updatesFound
              label: Updates found
              format: number
            - field: schedules.0.lastExecution.details.errors
              label: Errors
              format: number
            # recentExecutions[0] often has summary (updated/blocked/failed)
            - field: schedules.0.recentExecutions.0.details.summary.updated
              label: Updated
              format: text
            - field: schedules.0.recentExecutions.0.details.summary.failed
              label: Failed
              format: text
        server: docker
        container: dockhand
    - Vaultwarden:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/bitwarden.webp
        href: "{{HOMEPAGE_VAR_VAULTWARDEN_URL}}"
        description: "Self-hosted Password Manager"
        server: docker
        container: vaultwarden
        showStats: true
    - OnlyOffice:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@master/webp/onlyoffice.webp
        description: "Document Server"
        server: docker
        container: onlyoffice
        showStats: true
    - Postgres:
        icon: si-postgresql-#336791
        description: "Database Server"
        server: docker
        container: postgres
        showStats: true
    - Redis:
        icon: si-redis-#DC382D
        description: "In-memory Data Structure Store"
        server: docker
        container: redis
        showStats: true

