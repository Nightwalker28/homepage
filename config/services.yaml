- Infrastructure:
    - Proxmox:
        id: widget-proxmox
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/proxmox.webp
        href: "{{HOMEPAGE_VAR_PROXMOX_HREF}}"
        description: Node, guest, storage, and update status
        siteMonitor: http://widget-gateway:3001/internal/v1/widgets/proxmox/health
        widget:
          type: customapi
          url: http://widget-gateway:3001/internal/v1/widgets/proxmox/summary
          refreshInterval: 30000
          mappings:
            - field: data.cpu
