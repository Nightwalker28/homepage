name: homepage

x-logging: &homelab-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  homepage:
    # Identity and lifecycle.
    image: gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped

    # Process and startup.
    user: 1000:1000
    group_add:
      - '989'
    depends_on:
      - widget-gateway

    # Application configuration.
    env_file:
      - ./config/public.env
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: '022'
      HOMEPAGE_ALLOWED_HOSTS: dash.maadmustafa.dev,homepage:3000

    # Persistent and temporary storage.
    volumes:
      - ./config:/app/config
      - /mnt/media:/mnt/media:ro
      - /home:/home:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/icons:/app/public/icons

    # Network connections.
    networks:
      - proxy

    # Reverse proxy routing and metadata.
    labels:
      traefik.enable: 'true'
      traefik.docker.network: proxy
      traefik.http.routers.homepage.rule: Host(`dash.maadmustafa.dev`)
      traefik.http.routers.homepage.entrypoints: websecure
      traefik.http.routers.homepage.tls: 'true'
      traefik.http.routers.homepage.tls.certresolver: cloudflare
      traefik.http.routers.homepage.middlewares: dashboard-auth@docker
      traefik.http.services.homepage.loadbalancer.server.port: '3000'

    # Runtime security.
    security_opt:
      - no-new-privileges:true

    # Resource limits.
    mem_limit: 768m
    cpus: 1.0

    # Log retention.
    logging: *homelab-logging

  widget-gateway:
    # Identity and lifecycle.
    image: homepage-widget-gateway:local
    build:
      context: ./gateway
    container_name: widget-gateway
    restart: unless-stopped

    # Application configuration.
    env_file:
      - ./gateway/.env
    environment:
      ADGUARD_URL: http://host.docker.internal:8088
      AUTHENTIK_URL: http://authentik-server:9000
      BAZARR_URL: http://bazarr:6767
      DASHBOARD_ORIGIN: https://dash.maadmustafa.dev
      DOCKHAND_URL: http://dockhand:3000
      HOME_ASSISTANT_URL: http://host.docker.internal:8123
      IMMICH_URL: http://immich-server:2283
      JELLYFIN_URL: http://jellyfin:8096
      PORT: '3001'
      PROWLARR_URL: http://prowlarr:9696
      PROXMOX_TLS_INSECURE: 'true'
      QBITTORRENT_URL: http://qbittorrent:8005
      RADARR_URL: http://radarr:7878
      SEERR_URL: http://seerr:5055
      SONARR_URL: http://sonarr:8989
      SPEEDTEST_URL: http://speedtest

    # Persistent and temporary storage.
    tmpfs:
      - /tmp

    # Network connections.
    networks:
      - proxy
    extra_hosts:
      - host.docker.internal:host-gateway

    # Reverse proxy routing and metadata.
    labels:
      traefik.enable: 'true'
      traefik.docker.network: proxy
      traefik.http.routers.widget-gateway.rule: Host(`dash.maadmustafa.dev`) && PathPrefix(`/api/widget-gateway`)
      traefik.http.routers.widget-gateway.priority: '100'
      traefik.http.routers.widget-gateway.entrypoints: websecure
      traefik.http.routers.widget-gateway.tls: 'true'
      traefik.http.routers.widget-gateway.tls.certresolver: cloudflare
      traefik.http.routers.widget-gateway.middlewares: dashboard-auth@docker
      traefik.http.services.widget-gateway.loadbalancer.server.port: '3001'
      traefik.http.middlewares.dashboard-auth.forwardauth.address: https://auth.maadmustafa.dev/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.dashboard-auth.forwardauth.trustForwardHeader: 'true'
      traefik.http.middlewares.dashboard-auth.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid

    # Health checks and shutdown.
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - '-'
        - http://127.0.0.1:3001/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Runtime security.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # Resource limits.
    mem_limit: 384m
    cpus: 0.75

    # Log retention.
    logging: *homelab-logging

networks:
  proxy:
    external: true
